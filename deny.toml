[advisories]
version = 2
yanked = "deny"
# Maintenance-only notices in existing transitive dependencies. Security
# advisories still fail; cargo-audit also continues to report these notices.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is an existing transitive dependency; see docs/third-party.md" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is transitive through the existing egui font stack; see docs/third-party.md" },
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "IJG",
    "MIT",
    "NCSA",
    "OFL-1.1",
    "Unicode-3.0",
    "Ubuntu-font-1.0",
    "Zlib",
]

# Rawler is vendored with its original LGPL license and the complete patched
# source. Source and binary downloads are offered from the same private repo.
[[licenses.exceptions]]
name = "rawler"
version = "0.7.0"
allow = ["LGPL-2.1"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
